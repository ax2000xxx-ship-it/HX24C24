<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>HX - ملفات وألعاب</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef1ff;--card:#fff;--ink:#16193a;--mute:#5d6288;--acc:#2b45ff;--pop:#ffd84a;--line:#d5dafc;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10122b;--card:#1a1d42;--ink:#eef0ff;--mute:#a3a8d6;--acc:#7f93ff;--pop:#ffd84a;--line:#2c3066}}
:root[data-theme="dark"]{--bg:#10122b;--card:#1a1d42;--ink:#eef0ff;--mute:#a3a8d6;--acc:#7f93ff;--pop:#ffd84a;--line:#2c3066}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Tajawal',system-ui,sans-serif;line-height:1.6;transition:background .2s ease,color .2s ease}
.wrap{max-width:960px;margin:0 auto;padding:20px 16px 48px}
header{display:flex;justify-content:space-between;align-items:center;gap:12px}
.logo{font-weight:900;font-size:1.4rem}
.logo span{background:var(--pop);color:#16193a;padding:0 8px;border-radius:6px}
button{font-family:inherit;cursor:pointer}
#theme{background:none;border:1px solid var(--line);color:var(--ink);border-radius:20px;padding:6px 14px;font-size:.9rem}
h1{font-size:clamp(2rem,8vw,3.4rem);font-weight:900;line-height:1.15;margin:28px 0 8px}
.sub{color:var(--mute);margin:0 0 20px}
#q{width:100%;padding:14px 16px;font:inherit;font-size:1rem;border:2px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);transition:border-color .2s}
#q:focus,button:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.tabs{display:flex;gap:8px;margin:14px 0 20px;overflow-x:auto;padding-bottom:4px}
.tab{flex:none;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:6px 16px;border-radius:20px;font-size:.95rem;transition:all .2s}
.tab[aria-pressed="true"]{background:var(--acc);border-color:var(--acc);color:#fff}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.item{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:8px;box-shadow:0 2px 8px rgba(0,0,0,.03)}
.ico{width:48px;height:48px;border-radius:12px;display:grid;place-items:center;font-size:1.6rem;background:var(--pop)}
.item h3{margin:0;font-size:1.1rem;word-break:break-word}
.item p{margin:0;color:var(--mute);font-size:.9rem;flex:1;white-space:pre-line;word-break:break-word}
.meta{font-size:.8rem;color:var(--mute)}
.dl{position:relative;overflow:hidden;border:0;background:var(--acc);color:#fff;padding:10px;border-radius:10px;font-weight:700;font-size:1rem;text-align:center}
.dl i{position:absolute;inset:0 auto 0 0;width:0;background:rgba(255,255,255,.3);transition:width .4s ease}
.dl.loading i{width:100%}
.dl span{position:relative;z-index:1}
.empty{text-align:center;color:var(--mute);padding:40px 0}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}

.admin{background:var(--card);border:2px solid var(--acc);border-radius:14px;padding:18px;margin:20px 0;display:grid;gap:12px;box-shadow:0 4px 20px rgba(43,69,255,.08)}
.admin-header{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line);padding-bottom:10px}
.admin-badge{background:var(--acc);color:#fff;padding:2px 10px;border-radius:12px;font-size:.8rem;font-weight:700}
.admin label{font-size:.9rem;color:var(--mute);display:grid;gap:4px}
.admin input,.admin textarea,.admin select{font:inherit;padding:10px;border:2px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink)}
.row{display:flex;gap:8px;flex-wrap:wrap}.row>*{flex:1}
.btn{border:0;background:var(--acc);color:#fff;padding:10px 16px;border-radius:10px;font-weight:700;font-size:1rem;transition:opacity .2s;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn:hover{opacity:.9}
.btn.alt{background:var(--card);color:var(--ink);border:1px solid var(--line)}
.btn.del{background:#d93a3a}
.btn.edit{background:#e69500}
.thumb{width:100%;height:130px;object-fit:cover;border-radius:10px}
#msg{color:var(--mute);font-size:.9rem;min-height:1.4em;font-weight:700}
.card-actions{display:flex;gap:6px;margin-top:auto}
.card-actions>button{flex:1}
.sec-box{background:var(--bg);border:1px dashed var(--line);border-radius:10px;padding:12px;display:grid;gap:8px}
[hidden]{display:none!important}
</style>
</head>
<body>
<div class="wrap">
<header>
  <div class="logo" role="img" aria-label="HX">
    <svg viewBox="0 0 120 100" width="64" height="53" style="display:block;color:var(--ink)">
      <g fill="currentColor"><rect x="4" y="6" width="18" height="88" rx="9"/><rect x="40" y="6" width="18" height="88" rx="9"/><rect x="4" y="42" width="54" height="16" rx="8"/></g>
      <g stroke-linecap="round" fill="none"><path d="M72 22L108 78M108 22L72 78" stroke="currentColor" stroke-width="30"/><path d="M72 22L108 78M108 22L72 78" stroke="var(--bg)" stroke-width="13"/></g>
    </svg>
  </div>
  <span><button id="theme" aria-label="تغيير المظهر">🌓 المظهر</button></span>
</header>

<h1>ملفات وألعاب<br>بضغطة واحدة</h1>
<p class="sub">ابحث، اختر، وحمّل.</p>

<!-- لوحة تحكم الإدارة -->
<form id="admin" class="admin" hidden>
  <div class="admin-header">
    <div style="display:flex;align-items:center;gap:8px">
      <b style="font-size:1.1rem">لوحة الإدارة والمحتوى</b>
      <span class="admin-badge">نشطة</span>
    </div>
    <button class="btn alt" id="close" type="button" style="padding:4px 12px;font-size:.85rem">✖ إغلاق</button>
  </div>

  <div class="meta">
    التعديلات تُحفظ كمسودة محلياً في متصفحك. لتثبيتها للزوار اضغط «تصدير items.json» وارفع الملف لمستودع GitHub.
  </div>

  <input type="hidden" id="editId">

  <label>اسم الملف أو اللعبة<input id="fn" required placeholder="مثال: GTA San Andreas أو برنامج WinRAR"></label>
  <label>الوصف<textarea id="fd" rows="3" placeholder="نبذة واضحة ومميزات الملف..."></textarea></label>
  <div class="row">
    <label>القسم<select id="fc"><option>ملفات</option><option>ألعاب</option><option>أدوات</option><option>برامج</option></select></label>
    <label>الحجم (اختياري)<input id="fs" placeholder="مثال: 1.2 GB أو 35 MB"></label>
  </div>
  <label>الصورة (اختياري - تُضغط تلقائياً)<input id="fi" type="file" accept="image/*"></label>
  <label>رابط التحميل المباشر<input id="fu" type="url" required dir="ltr" placeholder="https://..."></label>
  
  <div class="row">
    <button class="btn" id="save" type="submit">نشر في المسودة</button>
    <button class="btn alt" id="cancelEdit" type="button" hidden>إلغاء التعديل</button>
    <button class="btn alt" id="reset" type="button">مسح الحقول</button>
  </div>

  <div class="row">
    <button class="btn" id="export" type="button">💾 تصدير items.json</button>
    <button class="btn alt" id="discard" type="button">تفريغ المسودة بالكامل</button>
  </div>

  <!-- إدارة رمز الدخول السري -->
  <div class="sec-box">
    <b>🔐 رمز الدخول للوحة التحكم:</b>
    <div class="row" style="align-items:center">
      <input id="newPass" placeholder="رمز دخول جديد (الافتراضي: HX2423DEV)" style="background:var(--card)">
      <button class="btn alt" id="savePass" type="button" style="flex:none">حفظ الرمز</button>
    </div>
  </div>

  <div id="msg" role="status"></div>
  
  <b style="margin-top:10px">المنشورات الحالية (إدارة/تعديل/حذف):</b>
  <div id="list" class="grid"></div>
</form>

<input id="q" type="search" placeholder="ابحث عن ملف أو لعبة… (أو اكتب رمز الإدارة)" aria-label="بحث">
<div class="tabs" id="tabs"></div>
<div class="grid" id="grid"></div>
<p class="empty" id="empty" hidden>لا توجد نتائج مطابقة لبحثك.</p>
</div>

<script>
const $ = id => document.getElementById(id);
const DEFAULT_CODE = "HX2423DEV", KEY = "hx_draft_v1", THEME_KEY = "hx_theme", PASS_KEY = "hx_admin_code";
let LOCAL = false, PUB = [], ITEMS = [], cats = ["الكل"], cat = "الكل", term = "", adminOn = false;

// استرجاع كود الإدارة
const getAdminCode = () => localStorage.getItem(PASS_KEY) || DEFAULT_CODE;

// إدارة المظهر
const savedTheme = localStorage.getItem(THEME_KEY);
if (savedTheme) document.documentElement.dataset.theme = savedTheme;

$("theme").onclick = () => {
  const r = document.documentElement;
  const isDark = r.dataset.theme === "dark" || (!r.dataset.theme && window.matchMedia("(prefers-color-scheme: dark)").matches);
  const next = isDark ? "light" : "dark";
  r.dataset.theme = next;
  try { localStorage.setItem(THEME_KEY, next); } catch(e){}
};

// تشفير آمن للنصوص
const esc = t => String(t == null ? "" : t).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

const ls = {
  get(){ try { return JSON.parse(localStorage.getItem(KEY)); } catch(e){ return null; } },
  set(v){ try { localStorage.setItem(KEY, JSON.stringify(v)); } catch(e){ $("msg").textContent = "تعذر الحفظ، مساحة التخزين ممتلئة!"; } },
  clear(){ try { localStorage.removeItem(KEY); } catch(e){} }
};

function tabs(){
  cats = ["الكل", ...new Set(ITEMS.map(x => x.c).filter(Boolean))];
  if(!cats.includes(cat)) cat = "الكل";
  $("tabs").innerHTML = "";
  cats.forEach(c => {
    const b = document.createElement("button");
    b.type = "button";
    b.className = "tab";
    b.textContent = c;
    b.setAttribute("aria-pressed", c === cat);
    b.onclick = () => { cat = c; tabs(); render(); };
    $("tabs").appendChild(b);
  });
}

function card(x, adm){
  const el = document.createElement("div");
  el.className = "item";
  const pic = x.img ? `<img class="thumb" alt="${esc(x.n)}" src="${esc(x.img)}" loading="lazy">` : `<div class="ico">📦</div>`;
  el.innerHTML = pic + `<h3>${esc(x.n)}</h3><p>${esc(x.d || "لا يوجد وصف متوفر")}</p><div class="meta">${esc(x.c || "عام")}${x.s ? " · " + esc(x.s) : ""}</div>`;
  
  if(adm){
    const actions = document.createElement("div");
    actions.className = "card-actions";
    
    // زر التعديل
    const editBtn = document.createElement("button");
    editBtn.type = "button";
    editBtn.className = "btn edit";
    editBtn.textContent = "✏️ تعديل";
    editBtn.onclick = () => startEdit(x);

    // زر الحذف
    const delBtn = document.createElement("button");
    delBtn.type = "button";
    delBtn.className = "btn del";
    delBtn.textContent = "🗑️ حذف";
    let armed = false;
    delBtn.onclick = () => {
      if(!armed){
        armed = true;
        delBtn.textContent = "تأكيد؟";
        setTimeout(() => { armed = false; delBtn.textContent = "🗑️ حذف"; }, 3500);
        return;
      }
      ITEMS = ITEMS.filter(y => y.id !== x.id);
      ls.set(ITEMS);
      if($("editId").value === x.id) cancelEdit();
      tabs();
      render();
    };

    actions.appendChild(editBtn);
    actions.appendChild(delBtn);
    el.appendChild(actions);
  } else {
    const b = document.createElement("button");
    b.type = "button";
    b.className = "dl";
    b.innerHTML = "<i></i><span>تحميل</span>";
    b.onclick = () => {
      if(!/^https?:\/\//i.test(x.url || "")){
        b.querySelector("span").textContent = "الرابط غير متوفر";
        return;
      }
      b.classList.add("loading");
      b.querySelector("span").textContent = "جارٍ الفتح…";
      setTimeout(() => {
        window.open(x.url, "_blank", "noopener,noreferrer");
        b.classList.remove("loading");
        b.querySelector("span").textContent = "تم ✓";
        setTimeout(() => b.querySelector("span").textContent = "تحميل", 2000);
      }, 350);
    };
    el.appendChild(b);
  }
  return el;
}

function startEdit(item){
  $("editId").value = item.id;
  $("fn").value = item.n || "";
  $("fd").value = item.d || "";
  $("fc").value = item.c || "ملفات";
  $("fs").value = item.s || "";
  $("fu").value = item.url || "";
  $("save").textContent = "💾 حفظ التعديل";
  $("cancelEdit").hidden = false;
  $("admin").scrollIntoView({ behavior: "smooth" });
  $("msg").textContent = `جارٍ تعديل: ${item.n}`;
}

function cancelEdit(){
  $("editId").value = "";
  $("admin").reset();
  $("save").textContent = "نشر في المسودة";
  $("cancelEdit").hidden = true;
  $("msg").textContent = "";
}

function render(){
  const t = term.toLowerCase();
  const list = ITEMS.filter(x => {
    const matchCat = (cat === "الكل" || x.c === cat);
    const text = ((x.n || "") + " " + (x.d || "")).toLowerCase();
    return matchCat && text.includes(t);
  });

  $("empty").hidden = list.length > 0;
  $("empty").textContent = ITEMS.length ? "لا توجد نتائج مطابقة لبحثك." : "لا توجد منشورات متاحة بعد.";
  
  $("grid").innerHTML = "";
  list.forEach(x => $("grid").appendChild(card(x, false)));
  
  if(adminOn){
    $("list").innerHTML = "";
    ITEMS.forEach(x => $("list").appendChild(card(x, true)));
  }
}

function showAdmin(on){
  adminOn = on;
  $("admin").hidden = !on;
  if(on){
    const d = ls.get();
    ITEMS = Array.isArray(d) ? d : PUB.slice();
    $("newPass").placeholder = `الرمز الحالي: ${getAdminCode()}`;
  } else {
    const d = ls.get();
    ITEMS = (LOCAL || !PUB.length) ? (Array.isArray(d) ? d : []) : PUB.slice();
  }
  tabs();
  render();
}

$("q").oninput = e => {
  term = e.target.value.trim();
  if(term === getAdminCode()){
    e.target.value = "";
    term = "";
    showAdmin(true);
    return;
  }
  render();
};

$("close").onclick = () => { cancelEdit(); showAdmin(false); };
$("reset").onclick = () => cancelEdit();
$("cancelEdit").onclick = () => cancelEdit();

$("savePass").onclick = () => {
  const p = $("newPass").value.trim();
  if(!p){ $("msg").textContent = "يرجى كتابة رمز دخول صالح!"; return; }
  localStorage.setItem(PASS_KEY, p);
  $("newPass").value = "";
  $("newPass").placeholder = `الرمز الحالي: ${p}`;
  $("msg").textContent = "تم تغيير رمز الإدارة بنجاح ✓";
};

$("discard").onclick = () => {
  if($("discard").dataset.a !== "1"){
    $("discard").dataset.a = "1";
    $("discard").textContent = "اضغط لتأكيد الحذف الكلي";
    setTimeout(() => { $("discard").dataset.a = ""; $("discard").textContent = "تفريغ المسودة بالكامل"; }, 3500);
    return;
  }
  ls.clear();
  $("discard").dataset.a = "";
  $("discard").textContent = "تفريغ المسودة بالكامل";
  cancelEdit();
  showAdmin(true);
};

$("export").onclick = () => {
  const b = new Blob([JSON.stringify(ITEMS, null, 2)], {type: "application/json"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(b);
  a.download = "items.json";
  document.body.appendChild(a);
  a.click();
  a.remove();
  $("msg").textContent = "تم تحميل items.json! ارفعه إلى GitHub مكان الملف القديم لنشره للجميع.";
};

function shrink(f){
  return new Promise((ok, no) => {
    const u = URL.createObjectURL(f), i = new Image();
    i.onload = () => {
      const m = 640, k = Math.min(1, m / Math.max(i.width, i.height));
      const c = document.createElement("canvas");
      c.width = Math.round(i.width * k);
      c.height = Math.round(i.height * k);
      c.getContext("2d").drawImage(i, 0, 0, c.width, c.height);
      URL.revokeObjectURL(u);
      let q = 0.8, d = c.toDataURL("image/jpeg", q);
      while(d.length > 150000 && q > 0.3){ q -= 0.1; d = c.toDataURL("image/jpeg", q); }
      ok(d);
    };
    i.onerror = () => no(new Error("تعذر قراءة ملف الصورة."));
    i.src = u;
  });
}

$("admin").onsubmit = async e => {
  e.preventDefault();
  const n = $("fn").value.trim(), lk = $("fu").value.trim();
  if(!n || !/^https?:\/\//i.test(lk)){
    $("msg").textContent = "يرجى كتابة اسم صحيح ورابط يبدأ بـ https://";
    return;
  }
  
  $("save").disabled = true;
  $("msg").textContent = "جارٍ الحفظ…";
  
  try{
    const editId = $("editId").value;
    const im = $("fi").files[0];
    let compressedImg = null;
    if(im) compressedImg = await shrink(im);

    if(editId){
      // حالة التعديل
      const idx = ITEMS.findIndex(x => x.id === editId);
      if(idx !== -1){
        ITEMS[idx] = {
          ...ITEMS[idx],
          n,
          d: $("fd").value.trim(),
          c: $("fc").value,
          s: $("fs").value.trim(),
          url: lk,
          img: compressedImg || ITEMS[idx].img,
          updatedAt: Date.now()
        };
        $("msg").textContent = "تم تحديث المنشور بنجاح ✓";
      }
      cancelEdit();
    } else {
      // حالة الإضافة الجديدة
      const doc = {
        id: "i" + Date.now(),
        n,
        d: $("fd").value.trim(),
        c: $("fc").value,
        s: $("fs").value.trim(),
        url: lk,
        t: Date.now()
      };
      if(compressedImg) doc.img = compressedImg;
      ITEMS.unshift(doc);
      cancelEdit();
      $("msg").textContent = "تمت الإضافة للمسودة ✓؛ اضغط «تصدير items.json» لرفعه لـ GitHub.";
    }

    ls.set(ITEMS);
    tabs();
    render();
  } catch(er){
    $("msg").textContent = "حدث خطأ: " + (er?.message || "تعذر الحفظ");
  }
  $("save").disabled = false;
};

// تهيئة البيانات والتحميل
tabs();
render();

fetch("items.json?v=" + Date.now())
  .then(r => {
    if(!r.ok) throw new Error("HTTP " + r.status);
    return r.json();
  })
  .then(d => {
    PUB = Array.isArray(d) ? d : [];
    if(!adminOn){
      ITEMS = PUB.length ? PUB.slice() : (ls.get() || []);
      tabs();
      render();
    }
  })
  .catch(() => {
    LOCAL = true;
    const draft = ls.get() || [];
    PUB = draft;
    if(!adminOn){
      ITEMS = draft.slice();
      tabs();
      render();
    }
  });
</script>
</body>
</html>
